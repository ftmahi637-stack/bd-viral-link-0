<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BD VIRAL LINK</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/">BD <span>VIRAL</span> LINK</a><a class="admin-link" href="/">Public Site ↗</a></header><main class="admin-wrap"><div class="eyebrow">CONTROL CENTER</div><h1>Admin Dashboard</h1><section id="loginBox" class="panel"><h2>Admin Login</h2><form id="loginForm" class="form"><label>Username<input name="username" required value="admin"></label><label>Password<input name="password" type="password" required placeholder="Admin password"></label><button class="primary">Login</button><p id="loginMsg" class="error"></p></form></section>
<section id="dashboard" hidden><div class="panel"><h2>নতুন ভিডিও Upload</h2><form id="uploadForm" class="form"><label>ভিডিওর Title<input name="title" required maxlength="120" placeholder="ভিডিওর নাম"></label><label>Description<textarea name="description" rows="3" placeholder="ভিডিও সম্পর্কে লিখুন"></textarea></label><div class="two"><label>Category<input name="category" placeholder="যেমন: Entertainment"></label><label>Thumbnail URL (ঐচ্ছিক)<input name="thumbnail" type="url" placeholder="https://..."></label></div><label>ভিডিও ফাইল<input name="video" type="file" accept="video/mp4,video/webm,video/quicktime,video/ogg" required></label><button class="primary">Upload Video</button><p id="uploadMsg" class="muted"></p></form></div><div class="panel"><h2>তোমার ভিডিওসমূহ</h2><div id="adminVideos"></div></div><button id="logout" class="secondary">Logout</button></section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opts={}){const r=await fetch(url,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"কাজটি করা যায়নি");return d}
async function refresh(){const videos=await api("/api/videos");$("#adminVideos").innerHTML=videos.length?videos.map(v=>`<div class="admin-video"><div><b>${esc(v.title)}</b><p class="muted">${esc(v.category)}</p><a href="/watch/${v.id}" target="_blank">ভিডিও খুলুন ↗</a> · <button class="text-btn" data-copy="${v.id}">Share link কপি</button></div><button class="delete" data-delete="${v.id}">Delete</button></div>`).join(""):"এখনো কোনো ভিডিও নেই।";document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(location.origin+"/watch/"+b.dataset.copy);b.textContent="কপি হয়েছে ✓"});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("এই ভিডিওটি Delete করবেন?")){await api("/api/admin/videos/"+b.dataset.delete,{method:"DELETE"});refresh()}})}
async function show(){const d=await api("/api/admin/me");$("#loginBox").hidden=d.admin;$("#dashboard").hidden=!d.admin;if(d.admin)refresh()}
$("#loginForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$("#loginMsg").textContent="";show()}catch(err){$("#loginMsg").textContent=err.message}};
$("#uploadForm").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;$("#uploadMsg").textContent="Upload চলছে...";try{const d=await api("/api/admin/videos",{method:"POST",body:new FormData(e.target)});$("#uploadMsg").innerHTML=`Upload সম্পন্ন! <a href="${d.shareUrl}" target="_blank">ভিডিওর Share Link খুলুন ↗</a>`;e.target.reset();refresh()}catch(err){$("#uploadMsg").textContent=err.message}finally{b.disabled=false}};
$("#logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});show()};show();
</script></body></html>
