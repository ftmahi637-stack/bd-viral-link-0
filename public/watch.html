<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch — BD VIRAL LINK</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><a class="brand" href="/">BD <span>VIRAL</span> LINK</a><a class="admin-link" href="/">সব ভিডিও</a></header><main class="watch-wrap"><div id="content"><p class="muted">ভিডিও লোড হচ্ছে...</p></div></main><script>
const id=location.pathname.split("/").pop(),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("/api/videos/"+encodeURIComponent(id)).then(async r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{document.title=v.title+" — BD VIRAL LINK";document.querySelector("#content").innerHTML=`<a class="back" href="/">← সব ভিডিও</a><div class="player"><video controls playsinline preload="metadata" poster="${esc(v.thumbnail)}"><source src="${esc(v.videoUrl)}"></video></div><div class="watch-title"><div><span class="tag">${esc(v.category)}</span><h1>${esc(v.title)}</h1><p class="muted">${esc(v.description)}</p></div><button id="share" class="primary">লিংক শেয়ার করুন ↗</button></div><p id="notice" class="muted"></p>`;document.querySelector("#share").onclick=async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:v.title,url});else{await navigator.clipboard.writeText(url);document.querySelector("#notice").textContent="লিংক কপি হয়েছে!";}}catch(e){}}}).catch(()=>document.querySelector("#content").innerHTML="<h2>ভিডিও পাওয়া যায়নি</h2><a href='/'>হোমপেজে ফিরুন</a>");
</script></body></html>
